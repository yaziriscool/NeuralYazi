<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - NeuralYazi</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			background: #000;
			overflow: hidden;
			font-family: Arial, Helvetica, sans-serif;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.background {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			filter: brightness(0.5);
		}

		.content {
			position: relative;
			z-index: 1;
			text-align: center;
			color: white;
			text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
			padding: 24px;
		}

		h1 {
			margin: 0;
			font-size: clamp(90px, 18vw, 260px);
			line-height: 0.85;
			font-weight: 900;
		}

		p {
			margin: 28px 0 0;
			font-size: clamp(18px, 3vw, 38px);
			font-weight: 700;
		}
	</style>
</head>
<body>
	<img class="background" src="https://i.imgur.com/fkItKiq.png" alt="">
	<div class="content">
		<h1>404</h1>
		<p>you weren't supposed to be here.</p>
	</div>
</body>
</html>
