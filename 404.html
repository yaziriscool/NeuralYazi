<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404</title>
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			background: #000;
			overflow: hidden;
		}

		.background {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			opacity: 0;
			animation: fadeInBg 1.2s ease-out forwards;
		}

		#static {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			opacity: 0;
			mix-blend-mode: screen;
			image-rendering: pixelated;
			animation: fadeInStatic 1.6s ease-out forwards;
		}

		@keyframes fadeInBg {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		@keyframes fadeInStatic {
			from { opacity: 0; }
			to { opacity: 0.5; }
		}
	</style>
</head>
<body>
	<img class="background" src="https://i.imgur.com/fkItKiq.png" alt="">
	<canvas id="static"></canvas>

	<script>
		const canvas = document.getElementById("static");
		const ctx = canvas.getContext("2d");

		function resize() {
			canvas.width = Math.max(1, Math.floor(innerWidth / 3));
			canvas.height = Math.max(1, Math.floor(innerHeight / 3));
		}

		function drawStatic() {
			const image = ctx.createImageData(canvas.width, canvas.height);
			const data = image.data;

			for (let i = 0; i < data.length; i += 4) {
				if (Math.random() < 0.5) {
					const brightness = 80 + Math.random() * 175;
					data[i] = brightness;
					data[i + 1] = Math.random() * 15;
					data[i + 2] = Math.random() * 10;
					data[i + 3] = 255;
				} else {
					data[i + 3] = 0;
				}
			}

			ctx.putImageData(image, 0, 0);
		}

		resize();
		drawStatic();
		window.addEventListener("resize", resize);
		setInterval(drawStatic, 45);
	</script>
</body>
</html>
